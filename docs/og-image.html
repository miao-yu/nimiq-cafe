<!doctype html>
<!--
  Source for client/public/logo/og-default.png, the link preview image used by
  Google, X, Telegram and Discord. Edit here, then regenerate at exactly the
  1200x630 those platforms expect:

    chrome-headless-shell --hide-scrollbars --window-size=1200,630 \
      --screenshot=client/public/logo/og-default.png docs/og-image.html

  Any headless Chrome works. It is a screenshot rather than a hand-drawn asset
  because the only NimiqCafe brand mark in the repo is 40x40 (logo-single.png),
  too small to scale into a preview card -- text rendered by the browser stays
  sharp at any size. If a high-resolution logo ever turns up, use it here.
-->
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #141A21;
    background-image:
      radial-gradient(1100px 620px at 82% 12%, rgba(0, 167, 111, 0.20), transparent 62%),
      radial-gradient(760px 520px at 6% 100%, rgba(0, 167, 111, 0.10), transparent 60%);
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #fff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 88px;
    position: relative;
  }
  .mark {
    display: flex; align-items: center; gap: 20px; margin-bottom: 40px;
  }
  .mark img { width: 76px; height: 76px; border-radius: 18px; display: block; }
  .mark span {
    font-size: 40px; font-weight: 700; letter-spacing: -0.5px;
  }
  .mark span b { color: #22C58B; font-weight: 700; }
  h1 {
    font-size: 78px; line-height: 1.06; font-weight: 800;
    letter-spacing: -2.4px; max-width: 15ch;
  }
  h1 em { font-style: normal; color: #22C58B; }
  p {
    margin-top: 30px; font-size: 31px; line-height: 1.4;
    color: #93A1AF; font-weight: 500; max-width: 30ch;
  }
  .rule {
    position: absolute; left: 0; right: 0; bottom: 0; height: 10px;
    background: linear-gradient(90deg, #00A76F 0%, #22C58B 46%, #5BE49B 100%);
  }
  .url {
    position: absolute; right: 88px; bottom: 62px;
    font-size: 27px; font-weight: 600; color: #6B7A8A; letter-spacing: 0.2px;
  }
</style>
<div class="mark">
  <img src="../client/public/logo/logo-single.png" alt="" />
  <span>Nimiq<b>Cafe</b></span>
</div>
<h1>Stake <em>NIM</em>. Explore the chain.</h1>
<p>Staking pool, block explorer, rewards calculator and NIM converter.</p>
<div class="url">nimiq.cafe</div>
<div class="rule"></div>
